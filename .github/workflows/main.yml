name: Build RPMs

on:
  push:
  workflow_dispatch:      # adds a "Run workflow" button for manual runs

jobs:
  rpm-master-portal:
    runs-on: ubuntu-latest
    container: rockylinux:9
    steps:
      - uses: actions/checkout@v4
      - run: dnf -y install rpm-build rpmdevtools
      - run: rpmdev-setuptree
      - name: Download Source URLs from aarc-master-portal.spec
        run: spectool -g -R SPECS/aarc-master-portal.spec
      - name: Download Source URLs from aarc-delegation-server.spec
        run: spectool -g -R SPECS/aarc-delegation-server.spec
      - name: Build Master Portal RPM
        run: rpmbuild -bb SPECS/aarc-master-portal.spec
      - name: Build Delegation Server RPM
        run: rpmbuild -bb SPECS/aarc-delegation-server.spec
      - uses: actions/upload-artifact@v7
        with:
          name: aarc-rpms
          path: ~/rpmbuild/RPMS/noarch
